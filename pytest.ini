[pytest]
markers =
    ollama: usa el Ollama real con el modelo de embeddings instalado (se omite si no está disponible)
    tts: usa los motores de voz reales (Piper y la voz de Windows); algunas hacen ida y vuelta con Whisper (se omiten si faltan)
    stt: usa el modelo de voz real (faster-whisper) y audio sintetizado (se omite si faltan el modelo o la voz)
filterwarnings =
    ignore::DeprecationWarning:starlette
